<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recursion tree method</title>
<style>
:root{
  --text-primary:#1f1e1d; --text-secondary:#6b6a65;
  --border:#e0ded6; --border-strong:#b9b7ad; --border-accent:#378ADD;
  --bg-accent:#E6F1FB; --text-accent:#185FA5;
  --bg-warning:#FAEEDA; --bg-success:#EAF3DE; --text-success:#27500A;
  --radius:8px; --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --text-primary:#f1efe8; --text-secondary:#a8a69d;
    --border:#3a3935; --border-strong:#5f5e5a; --border-accent:#85B7EB;
    --bg-accent:#0C447C; --text-accent:#B5D4F4;
    --bg-warning:#633806; --bg-success:#27500A; --text-success:#C0DD97;
  }
}
body{font-family:var(--font-sans);color:var(--text-primary);background:Canvas;margin:0;padding:16px;max-width:520px;margin-inline:auto}
button{font:inherit;font-size:13px;padding:8px 10px;border:0.5px solid var(--border-strong);border-radius:var(--radius);background:transparent;color:var(--text-primary);cursor:pointer}
button:hover{background:var(--bg-accent)}
.pb{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 12px}
.pb button.on{border:1.5px solid var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.lv{transition:opacity .6s}
.row{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:6px 0;border-top:0.5px solid var(--border)}
</style>
</head>
<body>
<div class="pb" id="pb"></div>
<div id="cap" style="font-size:14px;line-height:1.5;min-height:64px;margin:0 0 6px"></div>
<div id="tree"></div>
<div id="rows" style="margin:4px 0 8px"></div>
<div id="total" style="display:none;background:var(--bg-success);color:var(--text-success);border-radius:var(--radius);padding:10px 12px;font-size:14px;font-weight:500;margin:0 0 8px"></div>
<div style="display:flex;align-items:center;gap:8px;margin-top:8px">
  <button id="back" aria-label="Previous step">&larr;</button>
  <button id="play" style="flex:1">&#9654; Play</button>
  <button id="next" aria-label="Next step">&rarr;</button>
</div>
<div id="stp" style="font-size:12px;color:var(--text-secondary);text-align:center;margin-top:8px"></div>

<script>
var sub = {2:'₂', 4:'₄'};
// a = subproblems, b = size divisor, D = levels drawn, c = exponent in f(n)=n^c
var P = [
  {n:'2T(n/2) + n', a:2, b:2, D:3, c:1, cost:['n','n','n','n'],        fin:'n + n + … over log₂n levels = Θ(n log n)'},
  {n:'3T(n/4) + n', a:3, b:4, D:2, c:1, cost:['n','3n/4','9n/16'],     fin:'n(1 + ¾ + 9/16 + …) ≤ 4n = Θ(n)'},
  {n:'4T(n/2) + n', a:4, b:2, D:2, c:1, cost:['n','2n','4n'],          fin:'n(1 + 2 + 4 + … + n) ≈ n² = Θ(n²)'},
  {n:'T(n/2) + 1',  a:1, b:2, D:3, c:0, cost:['1','1','1','1'],        fin:'1 × log₂n levels = Θ(log n)'}
];
var pi = 0, step = 0, timer = null, p;

function lab(k){ return p.c == 0 ? '1' : (k == 0 ? 'n' : 'n/' + Math.pow(p.b, k)); }

function build(){
  p = P[pi];
  var D = p.D;
  var rowY = function(k){ return 26 + k * 62; };
  var H = rowY(D) + 13 + 50;
  var s = '<svg width="100%" viewBox="0 0 380 ' + H + '" role="img"><title>Recursion tree</title>';
  for (var k = 0; k <= D; k++){
    var cnt = Math.pow(p.a, k), slot = 340 / cnt, w = Math.min(slot - 6, 56), dot = w < 28;
    s += '<g class="lv" data-k="' + k + '">';
    for (var i = 0; i < cnt; i++){
      var x = 20 + slot * (i + 0.5), y = rowY(k);
      if (k > 0){
        var pc = Math.pow(p.a, k - 1), ps = 340 / pc, parent = Math.floor(i / p.a), px = 20 + ps * (parent + 0.5);
        s += '<line x1="' + px + '" y1="' + (rowY(k-1) + (pc >= 16 ? 5 : 13)) + '" x2="' + x + '" y2="' + (y - (dot ? 5 : 13)) + '" stroke="var(--border-strong)" stroke-width="0.5"/>';
      }
      if (dot){
        s += '<circle class="nd" cx="' + x + '" cy="' + y + '" r="5" stroke="var(--border-accent)" stroke-width="0.5"/>';
      } else {
        s += '<rect class="nd" x="' + (x - w/2) + '" y="' + (y - 13) + '" width="' + w + '" height="26" rx="6" stroke="var(--border-accent)" stroke-width="0.5"/>' +
             '<text x="' + x + '" y="' + y + '" text-anchor="middle" dominant-baseline="central" style="font-size:12px;fill:var(--text-primary);font-family:var(--font-sans)">' + lab(k) + '</text>';
      }
    }
    s += '</g>';
  }
  var ey = rowY(D) + 13 + 22;
  s += '<g class="lv" id="ell"><text x="190" y="' + ey + '" text-anchor="middle" style="font-size:12px;fill:var(--text-secondary);font-family:var(--font-sans)">⋮ continue until size 1 (depth log' + sub[p.b] + ' n)</text></g></svg>';
  document.getElementById('tree').innerHTML = s;

  var r = '';
  for (var k2 = 0; k2 <= D; k2++){
    r += '<div class="row" data-r="' + k2 + '"><span style="color:var(--text-secondary)">Level ' + k2 + '</span><span>' +
         Math.pow(p.a, k2) + ' × ' + lab(k2) + ' = <b style="font-weight:600">' + p.cost[k2] + '</b></span></div>';
  }
  document.getElementById('rows').innerHTML = r;
}

function caps(){
  var D = p.D;
  if (step == 0) return 'Root: the cost of one call, outside its recursive calls, is ' + lab(0) + '. It spawns ' + p.a + ' subproblem' + (p.a > 1 ? 's' : '') + ' of size n/' + p.b + '.';
  if (step <= D) return 'Expand level ' + step + ': ' + Math.pow(p.a, step) + ' node' + (Math.pow(p.a, step) > 1 ? 's' : '') + ', each costing ' + lab(step) + '. Level total: ' + p.cost[step] + '.';
  if (step == D + 1) return 'The pattern repeats until subproblems reach size 1, so the tree has about log' + sub[p.b] + ' n levels.';
  return 'Add up all the level costs to solve the recurrence.';
}

function upd(){
  var D = p.D, m = D + 2;
  document.querySelectorAll('#tree .lv[data-k]').forEach(function(g){
    var k = +g.dataset.k;
    g.style.opacity = k <= step ? 1 : 0;
    g.querySelectorAll('.nd').forEach(function(n){
      n.style.fill = (k == step) ? 'var(--bg-warning)' : 'var(--bg-accent)';
    });
  });
  document.getElementById('ell').style.opacity = step >= D + 1 ? 1 : 0;
  document.querySelectorAll('#rows .row').forEach(function(r){
    r.style.display = (+r.dataset.r <= Math.min(step, D)) ? 'flex' : 'none';
  });
  var t = document.getElementById('total');
  t.style.display = step == m ? 'block' : 'none';
  t.textContent = p.n + ':  ' + p.fin;
  document.getElementById('cap').textContent = caps();
  document.getElementById('stp').textContent = 'Step ' + (step + 1) + ' of ' + (m + 1);
  document.getElementById('play').innerHTML = timer ? '&#10074;&#10074; Pause' : (step == m ? '&#8635; Replay' : '&#9654; Play');
}

function stop(){ if (timer){ clearInterval(timer); timer = null; } }
function marks(){ document.querySelectorAll('#pb button').forEach(function(b, i){ b.className = i == pi ? 'on' : ''; }); }
function pick(i){ stop(); pi = i; step = 0; build(); upd(); marks(); }

var pbh = '';
P.forEach(function(q){ pbh += '<button>T(n) = ' + q.n + '</button>'; });
document.getElementById('pb').innerHTML = pbh;
document.querySelectorAll('#pb button').forEach(function(b, i){ b.onclick = function(){ pick(i); }; });

document.getElementById('next').onclick = function(){ stop(); if (step < p.D + 2) step++; upd(); };
document.getElementById('back').onclick = function(){ stop(); if (step > 0) step--; upd(); };
document.getElementById('play').onclick = function(){
  if (timer){ stop(); upd(); return; }
  if (step >= p.D + 2) step = 0;
  timer = setInterval(function(){
    if (step < p.D + 2) step++;
    if (step >= p.D + 2) stop();
    upd();
  }, 1700);
  upd();
};

pick(0);
</script>
</body>
</html>
